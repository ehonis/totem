[package]
name = "totem-desktop"
version = "0.2.0"
description = "Totem's desktop app: a native window around your Totem server"
license = "MIT"
edition = "2021"

[lib]
name = "totem_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2.14"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
# Cloudflare Access sign-in in the default browser (src/access/): the same
# reqwest and rustls the updater already pulls in, plus NaCl box.
base64 = "0.23"
crypto_box = { version = "0.9", features = ["std"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
