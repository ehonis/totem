<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in to Totem</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #0f1115; color: #e6e8ec;
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }
    main { width: min(400px, 100% - 48px); }
    h1 { font-size: 20px; font-weight: 600; margin: 0 0 6px; }
    p { margin: 0 0 20px; color: #9aa1ad; }
    .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    a.button {
      display: inline-block; padding: 8px 14px; border-radius: 8px; font-weight: 500;
      color: #fff; background: #3b6fd8; text-decoration: none;
    }
    a.link { color: #9aa1ad; font-size: 13px; }
    a.link:hover { color: #e6e8ec; }
    .error { color: #f08a7e; }
    .spinner {
      width: 14px; height: 14px; border-radius: 50%; display: inline-block; vertical-align: -2px;
      border: 2px solid #2a2f38; border-top-color: #5b8def; animation: spin .8s linear infinite;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Sign in to Totem</h1>
    <p id="text"></p>
    <div class="row">
      <a class="button" id="primary" href="totem-desktop://signin/open"></a>
      <a class="link" id="inside" href="totem-desktop://signin/inside">Sign in in this window instead</a>
    </div>
  </main>
  <script>
    // Rust tells this page where the sign-in stands (src-tauri/src/access/mod.rs,
    // status_script); the links are handled there too, as navigations it cancels.
    const $ = (id) => document.getElementById(id)
    const VIEWS = {
      idle: { text: 'Opening Totem…', spin: true },
      needed: {
        text: 'Your Totem is behind Cloudflare Access. Sign in with your usual browser, then come back here.',
        primary: ['Sign in with your browser', 'open'],
      },
      waiting: {
        text: 'Finish signing in in your browser. This window picks it up by itself.',
        spin: true,
        primary: ['Open the browser again', 'open'],
        inside: true,
      },
      done: { title: 'Signed in', text: 'Opening Totem…', spin: true },
      failed: { primary: ['Try again', 'retry'], inside: true, error: true },
    }
    window.totemSignin = (status) => {
      const view = VIEWS[status.state] || VIEWS.idle
      $('title').textContent = view.title || 'Sign in to Totem'
      const text = $('text')
      text.className = view.error ? 'error' : ''
      text.textContent = status.message || view.text || ''
      if (view.spin) text.insertAdjacentHTML('afterbegin', '<span class="spinner" aria-hidden="true"></span>')
      const primary = $('primary')
      primary.hidden = !view.primary
      if (view.primary) {
        primary.textContent = view.primary[0]
        primary.href = `totem-desktop://signin/${view.primary[1]}`
      }
      $('inside').hidden = !view.inside
    }
    window.totemSignin({ state: 'idle' })
  </script>
</body>
</html>
