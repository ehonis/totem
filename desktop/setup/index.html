<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Totem</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #0f1115; color: #e6e8ec;
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }
    main { width: min(420px, 100% - 48px); }
    h1 { font-size: 20px; font-weight: 600; margin: 0 0 6px; }
    p { margin: 0 0 20px; color: #9aa1ad; }
    label { display: block; font-weight: 500; margin-bottom: 6px; }
    input {
      width: 100%; padding: 9px 11px; border-radius: 8px; font: inherit; color: inherit;
      background: #181b21; border: 1px solid #2a2f38; outline: none;
    }
    input:focus { border-color: #5b8def; }
    button {
      margin-top: 12px; padding: 8px 14px; border: 0; border-radius: 8px; font: inherit;
      font-weight: 500; color: #fff; background: #3b6fd8; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: default; }
    .error { color: #f08a7e; min-height: 1.5em; margin-top: 8px; }
    dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; margin: 24px 0 8px; color: #9aa1ad; }
    dt { color: #e6e8ec; }
    kbd { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .path { font-size: 12px; color: #6f7682; word-break: break-all; }
  </style>
</head>
<body>
  <main>
    <h1>Connect to Totem</h1>
    <p>Enter your dashboard's address, the one you open in a browser.</p>
    <form id="form">
      <label for="url">Server address</label>
      <input id="url" type="url" placeholder="https://totem.example.com" autocomplete="url" required autofocus />
      <button id="save" type="submit">Connect</button>
      <div class="error" id="error" role="alert"></div>
    </form>
    <dl id="keys"></dl>
    <div class="path" id="path"></div>
  </main>
  <script>
    const { invoke } = window.__TAURI__.core
    const mac = navigator.userAgent.includes('Mac')
    const pretty = (accel) => accel
      .replace(/CommandOrControl|CmdOrCtrl/g, mac ? '⌘' : 'Ctrl')
      .replace(/Alt|Option/g, mac ? '⌥' : 'Alt')
      .replace(/Shift/g, mac ? '⇧' : 'Shift')
      .replace(/\+/g, mac ? '' : '+')

    invoke('get_config').then((config) => {
      if (config.server) document.getElementById('url').value = config.server
      const keys = document.getElementById('keys')
      for (const [label, accel] of [
        ['Show or hide', config.shortcuts.toggle],
        ['New chat', config.shortcuts.newChat],
        ['New todo', config.shortcuts.newTodo],
      ]) {
        if (!accel) continue
        keys.insertAdjacentHTML('beforeend', `<dt><kbd></kbd></dt><dd style="margin:0"></dd>`)
        keys.lastElementChild.textContent = label
        keys.lastElementChild.previousElementSibling.firstChild.textContent = pretty(accel)
      }
      document.getElementById('path').textContent = `Hotkeys are set in ${config.configPath}`
    })

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault()
      const button = document.getElementById('save')
      const error = document.getElementById('error')
      button.disabled = true
      error.textContent = ''
      try {
        await invoke('set_server', { url: document.getElementById('url').value })
      } catch (err) {
        error.textContent = String(err)
        button.disabled = false
      }
    })
  </script>
</body>
</html>
