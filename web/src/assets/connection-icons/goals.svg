<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Goals">
  <!-- In-house goals: a target, because a goal is a thing you are aiming at by a date -->
  <circle cx="11" cy="13" r="9.2" fill="none" stroke="#5b8cff" stroke-width="1.8"/>
  <circle cx="11" cy="13" r="5.4" fill="none" stroke="#7c5cff" stroke-width="1.8"/>
  <circle cx="11" cy="13" r="1.9" fill="#f0506e"/>
  <!-- the arrow already in it: progress is the point, not the ring -->
  <path d="M11 13 L21.5 2.5" stroke="#e3b341" stroke-width="1.9" stroke-linecap="round"/>
  <path d="M17.6 2.2 L21.8 2.2 L21.8 6.4" fill="none" stroke="#e3b341" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
