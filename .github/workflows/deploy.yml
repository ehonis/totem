name: Deploy

# Continuous deployment for an install that wants it: when CI passes on main, a
# self-hosted runner on the machine that serves Totem fast-forwards the live
# checkout, rebuilds, restarts the service and checks it answers, rolling back
# if any of that fails. If the iPhone app's code changed, it then ships that too:
# an over-the-air update, and a new App Store build when native code changed.
#
# Off unless the repository says where the install is (repository variables), so
# a fork or a copy of this repository never runs it.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time, in order; a deploy is never cancelled halfway.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  server:
    if: >-
      vars.DEPLOY_DIR != '' && (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: totem-deploy
    timeout-minutes: 45
    outputs:
      sha: ${{ steps.pull.outputs.after }}
      mobile: ${{ steps.pull.outputs.mobile }}
    env:
      DEPLOY_SERVICE: ${{ vars.DEPLOY_SERVICE || 'totem' }}
      DEPLOY_HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL || 'http://127.0.0.1:8787/health' }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ vars.DEPLOY_DIR }}
    steps:
      # Someone's uncommitted work in the live folder is never deployed over. Untracked
      # files are left alone; a pull that would overwrite one fails on its own.
      - name: The live checkout is clean and on main
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::error::The live checkout has uncommitted changes; nothing was deployed."
            git status --short --untracked-files=no
            exit 1
          fi
          if [ "$(git branch --show-current)" != main ]; then
            echo "::error::The live checkout is on $(git branch --show-current), not main; nothing was deployed."
            exit 1
          fi

      - name: Pull
        id: pull
        run: |
          set -euo pipefail
          before=$(git rev-parse HEAD)
          git fetch --quiet origin main
          git merge --ff-only --quiet origin/main
          after=$(git rev-parse HEAD)
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"
          # Nothing new is nothing to do, unless someone asked for a deploy by hand.
          if [ "$before" = "$after" ] && [ "${{ github.event_name }}" != workflow_dispatch ]; then
            echo "Already at $(git log --oneline -1); nothing to deploy."
            exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"
          changed=$(git diff --name-only "$before" "$after")
          # Install when the dependencies changed, or when the live folder has lost its
          # install (pnpm always writes node_modules/.modules.yaml; npm's leftover
          # .package-lock.json does not count, so the first pnpm deploy installs).
          if printf '%s\n' "$changed" | grep -qE '(^|/)(package(-lock)?\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml)$' || [ ! -f node_modules/.modules.yaml ]; then
            echo "deps=true" >> "$GITHUB_OUTPUT"
          fi
          # What the iPhone app is built from: its own folder.
          printf '%s\n' "$changed" | grep -qE '^mobile/' && echo "mobile=true" >> "$GITHUB_OUTPUT" || true
          echo "Deploying $(git log --oneline -1) (was ${before:0:7})"
          git log --oneline "$before..$after"

      # pnpm can be a Corepack link inside the node install (Homebrew's node@24 keeps it in
      # its versioned Cellar folder), which a node upgrade removes. Corepack ships with
      # node and puts it back.
      - name: pnpm is on PATH
        if: steps.pull.outputs.go == 'true'
        run: command -v pnpm >/dev/null || corepack enable pnpm

      - name: Install dependencies
        if: steps.pull.outputs.deps == 'true'
        run: |
          pnpm install --frozen-lockfile
          # node-pty ships its macOS helper without the execute bit.
          chmod +x node_modules/node-pty/prebuilds/darwin-*/spawn-helper 2>/dev/null || true

      - name: Build
        if: steps.pull.outputs.go == 'true'
        run: pnpm run build

      # A restart kills every chat reply and job in flight, so wait until no agent CLI is
      # running under the bridge (checked every 15 s, for up to 30 minutes), as the
      # bridge's own restartBridgeSoon does.
      - name: Restart once nothing is running
        if: steps.pull.outputs.go == 'true'
        run: |
          set -uo pipefail
          deadline=$(( $(date +%s) + 1800 ))
          while :; do
            if [ "$(uname)" = Darwin ]; then
              pid=$(launchctl print "gui/$(id -u)/$DEPLOY_SERVICE" 2>/dev/null | awk '/^\tpid =/{print $3}')
            else
              pid=$(systemctl --user show -p MainPID --value "$DEPLOY_SERVICE")
            fi
            busy=0
            if [ -n "$pid" ] && [ "$pid" != 0 ]; then
              busy=$(ps -A -o ppid=,comm= | awk -v p="$pid" '$1==p && $2~/(claude|codex|cursor-agent|opencode)$/' | wc -l | tr -d ' ')
            fi
            [ "$busy" = 0 ] && break
            if [ "$(date +%s)" -gt "$deadline" ]; then echo "::warning::Waited 30 minutes; restarting with $busy run(s) going"; break; fi
            echo "$busy run(s) going; waiting"
            sleep 15
          done
          set -e
          if [ "$(uname)" = Darwin ]; then
            launchctl kickstart -k "gui/$(id -u)/$DEPLOY_SERVICE"
          else
            systemctl --user restart "$DEPLOY_SERVICE"
          fi

      - name: The service answers
        if: steps.pull.outputs.go == 'true'
        run: |
          sleep 2
          for i in $(seq 1 60); do
            if curl -fsS --max-time 2 "$DEPLOY_HEALTH_URL" > /dev/null; then echo "Up after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "::error::$DEPLOY_HEALTH_URL did not answer within 60s"
          exit 1

      # A failed build or a service that will not start puts the last good version back.
      # It always reinstalls: a broken install fails the old version just the same.
      - name: Roll back
        if: failure() && steps.pull.outputs.before != ''
        run: |
          set -uo pipefail
          echo "::warning::Rolling back to ${{ steps.pull.outputs.before }}"
          git reset --hard --quiet "${{ steps.pull.outputs.before }}"
          # A commit from before the move to pnpm has only npm's lockfile.
          if [ -f pnpm-lock.yaml ]; then
            command -v pnpm >/dev/null || corepack enable pnpm
            pnpm install --frozen-lockfile
            pnpm run build
          else
            npm ci --no-audit --no-fund
            npm run build
          fi
          # node-pty ships its macOS helper without the execute bit.
          chmod +x node_modules/node-pty/prebuilds/darwin-*/spawn-helper 2>/dev/null || true
          if [ "$(uname)" = Darwin ]; then
            launchctl kickstart -k "gui/$(id -u)/$DEPLOY_SERVICE"
          else
            systemctl --user restart "$DEPLOY_SERVICE"
          fi

  # The iPhone app. Installed builds take an over-the-air update only when their native
  # code matches (runtimeVersion is a fingerprint of it). When no App Store build has
  # this fingerprint yet, one is started and submitted to TestFlight on its own.
  iphone:
    needs: server
    if: needs.server.outputs.mobile == 'true' && vars.EAS_PROJECT_ID != ''
    runs-on: ${{ github.event.repository.private && 'box' || 'ubuntu-latest' }}
    # An App Store build is waited for (about 10 minutes, more in a queue), then submitted.
    timeout-minutes: 75
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.server.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      # The install's identity is not in the repository (mobile/app.config.js).
      - name: The install's app identity
        env:
          BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
        run: |
          node -e 'require("fs").writeFileSync("app.local.json", JSON.stringify({ bundleIdentifier: process.env.BUNDLE_ID, easProjectId: process.env.PROJECT_ID }))'

      - name: Is there a build with this native code?
        id: native
        run: |
          set -euo pipefail
          rv=$(npx expo-updates runtimeversion:resolve --platform ios | node -pe 'JSON.parse(require("fs").readFileSync(0, "utf8")).runtimeVersion')
          builds=$(npx eas-cli build:list --platform ios --build-profile production --runtime-version "$rv" --limit 10 --json --non-interactive)
          live=$(printf '%s' "$builds" | node -pe 'JSON.parse(require("fs").readFileSync(0, "utf8")).filter(b => !["ERRORED", "CANCELED"].includes(b.status)).length')
          echo "runtime=$rv" >> "$GITHUB_OUTPUT"
          if [ "$live" = 0 ]; then echo "build=true" >> "$GITHUB_OUTPUT"; echo "Native code changed: no build has runtime $rv yet."; else echo "A build has runtime $rv."; fi

      - name: Publish the update
        run: npx eas-cli update --channel production --platform ios --environment production --non-interactive --message "$(git log -1 --format=%s)"

      # Submitting needs the App Store app id and an App Store Connect API key, which are
      # the install's own (repository variables and a secret). eas.json is part of the
      # runtime fingerprint, so they are written into it only after the build is uploaded:
      # written earlier, the build's runtime would differ from the update's and no
      # installed app would ever take an update again.
      - name: Build for the App Store and submit to TestFlight
        if: steps.native.outputs.build == 'true'
        env:
          ASC_APP_ID: ${{ vars.IOS_ASC_APP_ID }}
          ASC_API_KEY_ID: ${{ vars.ASC_API_KEY_ID }}
          ASC_API_KEY_ISSUER_ID: ${{ vars.ASC_API_KEY_ISSUER_ID }}
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
        run: |
          set -euo pipefail
          build=$(npx eas-cli build --platform ios --profile production --non-interactive --wait --json --message "$(git log -1 --format=%s)" | node -pe 'JSON.parse(require("fs").readFileSync(0, "utf8"))[0].id')
          echo "::notice::Native code changed, so App Store build $build was made. The update above reaches only that build, so nothing new reaches a phone until it is installed from TestFlight."
          if [ -z "$ASC_APP_ID" ] || [ -z "$ASC_API_KEY_ID" ] || [ -z "$ASC_API_KEY" ]; then
            echo "::error::Build $build was not submitted to TestFlight: set the IOS_ASC_APP_ID, ASC_API_KEY_ID and ASC_API_KEY_ISSUER_ID variables and the ASC_API_KEY secret (docs/self-hosting.md), or submit it by hand: npx eas-cli submit -p ios --id $build"
            exit 1
          fi
          key="$RUNNER_TEMP/asc-api-key.p8"
          printf '%s\n' "$ASC_API_KEY" > "$key"
          chmod 600 "$key"
          KEY="$key" node -e '
            const fs = require("fs"); const j = JSON.parse(fs.readFileSync("eas.json", "utf8"));
            j.submit.production = { ios: { ascAppId: process.env.ASC_APP_ID, ascApiKeyPath: process.env.KEY, ascApiKeyId: process.env.ASC_API_KEY_ID, ascApiKeyIssuerId: process.env.ASC_API_KEY_ISSUER_ID || undefined } };
            fs.writeFileSync("eas.json", JSON.stringify(j, null, 2))'
          npx eas-cli submit --platform ios --profile production --id "$build" --non-interactive --wait
          rm -f "$key"
