name: CI

on:
  pull_request:
  push:
    branches: [main]

# The private repo runs on the owner's own runner (label `box`); the public copy
# keeps GitHub's hosted runner. A new push to a PR cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ${{ github.event.repository.private && 'box' || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # build runs tsc --noEmit first, so this is the typecheck too.
      - run: pnpm run build
      - run: pnpm test

  bridge:
    runs-on: ${{ github.event.repository.private && 'box' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # --ignore-scripts: skip the web postinstall (the job above covers web) and
      # the optional node-pty build; no bridge test needs either.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test

  mobile:
    runs-on: ${{ github.event.repository.private && 'box' || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
