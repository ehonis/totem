name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # build runs tsc --noEmit first, so this is the typecheck too.
      - run: npm run build
      - run: npm test

  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # --ignore-scripts: skip the web postinstall (the job above covers web) and
      # the optional node-pty build; no bridge test needs either.
      - run: npm ci --ignore-scripts
      - run: npm test
